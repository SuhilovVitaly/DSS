name: Ubuntu support validation

on:
  push:
    branches: [codex/ep-0013-debug-tuning-panel]
    paths:
      - '.github/workflows/ubuntu-support.yml'
      - 'tools/ci/platform-baseline.py'
      - 'tools/ci/platform-layout.py'
      - 'tools/check-linux.sh'
      - 'src/**'
      - 'tests/**'
      - 'Directory.*.props'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        project: [DeepSpaceSaga.Client.Tests, DeepSpaceSaga.Contracts.Tests, DeepSpaceSaga.Engine.Tests, DeepSpaceSaga.Motion.Tests, DeepSpaceSaga.EconomyBalance.Tests, DeepSpaceSaga.Performance.Tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/../artifacts/validation/ep-0015-ubuntu-support/${{ github.run_id }}-${{ matrix.os }}-${{ matrix.project }}-sdk
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DSS_TEST_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and partitioned baseline
        id: checks
        shell: pwsh
        run: |
          $results = [IO.Path]::GetFullPath((Join-Path (Split-Path $env:GITHUB_WORKSPACE) "artifacts/validation/ep-0015-ubuntu-support/$env:GITHUB_RUN_ID-${{ matrix.os }}-${{ matrix.project }}"))
          "results=$results" >> $env:GITHUB_OUTPUT
          $selectedSdk = dotnet --version
          if (-not $selectedSdk.StartsWith('8.0.')) { throw "Expected SDK 8.0.x, selected $selectedSdk" }
          if ($IsLinux) {
            xvfb-run -a bash tools/check-linux.sh $results
          } else {
            python tools/ci/platform-baseline.py $results --project $env:DSS_TEST_PROJECT
          }
      - name: Ubuntu native layout captures
        if: ${{ always() && runner.os == 'Linux' && matrix.project == 'DeepSpaceSaga.Client.Tests' }}
        shell: pwsh
        run: |
          $results = '${{ steps.checks.outputs.results }}'
          $dll = Join-Path $env:GITHUB_WORKSPACE 'tools/DeepSpaceSaga.Performance/bin/Release/net8.0/DeepSpaceSaga.Performance.dll'
          if (-not (Test-Path -LiteralPath $dll)) { Write-Output 'NOT RUN native layouts: solution build did not produce the tool.'; exit 0 }
          python tools/ci/platform-layout.py $env:GITHUB_WORKSPACE (Join-Path $results 'native') --virtual-display
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep-0015-${{ matrix.os }}-${{ matrix.project }}
          path: ${{ steps.checks.outputs.results }}
          retention-days: 14
