name: Ubuntu support validation

on:
  push:
    branches: [codex/ep-0013-debug-tuning-panel]
    paths:
      - '.github/workflows/ubuntu-support.yml'
      - 'tools/ci/platform-baseline.py'
      - 'tools/check-linux.sh'
      - 'src/**'
      - 'tests/**'
      - 'Directory.*.props'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/../artifacts/validation/ep-0015-ubuntu-support/${{ github.run_id }}-${{ matrix.os }}-sdk
      DOTNET_MULTILEVEL_LOOKUP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and partitioned baseline
        id: checks
        shell: pwsh
        run: |
          $results = [IO.Path]::GetFullPath((Join-Path (Split-Path $env:GITHUB_WORKSPACE) "artifacts/validation/ep-0015-ubuntu-support/$env:GITHUB_RUN_ID-${{ matrix.os }}"))
          "results=$results" >> $env:GITHUB_OUTPUT
          $selectedSdk = dotnet --version
          if (-not $selectedSdk.StartsWith('8.0.')) { throw "Expected SDK 8.0.x, selected $selectedSdk" }
          if ($IsLinux) {
            xvfb-run -a bash tools/check-linux.sh $results
          } else {
            python tools/ci/platform-baseline.py $results
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep-0015-${{ matrix.os }}
          path: ${{ steps.checks.outputs.results }}
          retention-days: 14
