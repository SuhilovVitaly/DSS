name: Ubuntu support validation

on:
  push:
    branches: [codex/ep-0013-debug-tuning-panel]
    paths:
      - '.github/workflows/ubuntu-support.yml'
      - 'tools/ci/platform-baseline.py'
      - 'tools/ci/platform-layout.py'
      - 'tools/DeepSpaceSaga.Performance/**'
      - 'tools/check-linux.sh'
      - 'tools/publish-linux.sh'
      - 'tools/linux/**'
      - 'tools/ci/platform-publish.py'
      - 'tools/ci/platform-assets.ps1'
      - 'tools/Export-TacticalButtonAssets.ps1'
      - 'tools/DeepSpaceSaga.PortraitAssets/**'
      - 'src/**'
      - 'tests/**'
      - 'Directory.*.props'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
        project: [DeepSpaceSaga.Client.Tests, DeepSpaceSaga.Contracts.Tests, DeepSpaceSaga.Engine.Tests, DeepSpaceSaga.Motion.Tests, DeepSpaceSaga.EconomyBalance.Tests, DeepSpaceSaga.Performance.Tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/../artifacts/validation/ep-0015-ubuntu-support/${{ github.run_id }}-${{ matrix.os }}-${{ matrix.project }}-sdk
      DOTNET_MULTILEVEL_LOOKUP: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      DSS_TEST_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ubuntu graphics dependencies
        if: ${{ runner.os == 'Linux' && matrix.project == 'DeepSpaceSaga.Client.Tests' }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfontconfig1 libgl1-mesa-dri libglx-mesa0 libegl1 libglfw3 libxrandr2 libxcursor1 libxinerama1 libxi6 libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0 mesa-utils xvfb xauth
      - name: Build and partitioned baseline
        id: checks
        shell: pwsh
        run: |
          $results = [IO.Path]::GetFullPath((Join-Path (Split-Path $env:GITHUB_WORKSPACE) "artifacts/validation/ep-0015-ubuntu-support/$env:GITHUB_RUN_ID-${{ matrix.os }}-${{ matrix.project }}"))
          "results=$results" >> $env:GITHUB_OUTPUT
          $selectedSdk = dotnet --version
          if (-not $selectedSdk.StartsWith('8.0.')) { throw "Expected SDK 8.0.x, selected $selectedSdk" }
          if ($IsLinux) {
            xvfb-run -a bash tools/check-linux.sh $results
          } else {
            python tools/ci/platform-baseline.py $results --project $env:DSS_TEST_PROJECT
          }
      - name: Portable PowerShell asset scripts
        timeout-minutes: 5
        if: ${{ matrix.project == 'DeepSpaceSaga.Client.Tests' }}
        shell: pwsh
        run: |
          & ./tools/ci/platform-assets.ps1 -Repository $env:GITHUB_WORKSPACE -Results (Join-Path '${{ steps.checks.outputs.results }}' 'asset-scripts')
      - name: OpenAL native and unavailable-device checks
        timeout-minutes: 5
        if: ${{ runner.os == 'Linux' && matrix.project == 'DeepSpaceSaga.Client.Tests' }}
        shell: pwsh
        run: |
          $results = '${{ steps.checks.outputs.results }}'
          $env:DSS_DIAGNOSTICS_DIRECTORY = $results
          $env:DSS_INTERFACE_LOG_PATH = Join-Path $results 'audio-interface.log'
          $env:ALSOFT_DRIVERS = 'null'
          $env:DSS_EXPECT_AUDIO_AVAILABLE = 'true'
          Get-ChildItem tests/DeepSpaceSaga.Client.Tests/bin/Release/net8.0 -Recurse -Filter 'libopenal.so' | ForEach-Object { & ldd $_.FullName } *> (Join-Path $results 'openal-ldd.log')
          dotnet test tests/DeepSpaceSaga.Client.Tests -c Release --no-build --no-restore --filter FullyQualifiedName~CombatToneTests --results-directory $results --logger 'trx;LogFileName=openal-null.trx'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ALSOFT_DRIVERS = 'dss-unavailable-driver'
          $env:DSS_EXPECT_AUDIO_AVAILABLE = 'false'
          dotnet test tests/DeepSpaceSaga.Client.Tests -c Release --no-build --no-restore --filter FullyQualifiedName~NativeInitializationReportsDeviceOutcomeWithoutCrashing --results-directory $results --logger 'trx;LogFileName=openal-no-device.trx'
          exit $LASTEXITCODE
      - name: Ubuntu native layout captures
        if: ${{ always() && runner.os == 'Linux' && matrix.project == 'DeepSpaceSaga.Client.Tests' }}
        shell: pwsh
        run: |
          $results = '${{ steps.checks.outputs.results }}'
          $dll = Join-Path $env:GITHUB_WORKSPACE 'tools/DeepSpaceSaga.Performance/bin/Release/net8.0/DeepSpaceSaga.Performance.dll'
          if (-not (Test-Path -LiteralPath $dll)) { Write-Output 'NOT RUN native layouts: solution build did not produce the tool.'; exit 0 }
          $env:LIBGL_ALWAYS_SOFTWARE = 'true'
          & xvfb-run -a glxinfo -B *> (Join-Path $results 'glxinfo.log')
          Get-ChildItem -LiteralPath (Split-Path $dll) -Recurse -Filter 'libglfw*' | ForEach-Object { & ldd $_.FullName } *> (Join-Path $results 'glfw-ldd.log')
          python tools/ci/platform-layout.py $env:GITHUB_WORKSPACE (Join-Path $results 'native') --virtual-display
      - name: Self-contained Ubuntu package acceptance
        if: ${{ always() && runner.os == 'Linux' && matrix.project == 'DeepSpaceSaga.Client.Tests' }}
        shell: pwsh
        run: |
          python tools/ci/platform-publish.py $env:GITHUB_WORKSPACE (Join-Path '${{ steps.checks.outputs.results }}' 'distribution')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep-0015-${{ matrix.os }}-${{ matrix.project }}
          path: ${{ steps.checks.outputs.results }}
          retention-days: 14
